system:
  name: "Advanced AI Camera System"
  version: "1.0.0"
  debug: true

camera:
  index: 0
  width: 640
  height: 480
  fps: 30

processing:
  skip_frames: 0
  use_gpu: true

modules:
  face_detector:
    enabled: true
    min_detection_confidence: 0.5
    min_tracking_confidence: 0.5
    max_faces: 5

logging:
  level: "INFO"
  file: "logs/system.log"
