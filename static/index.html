<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera System - Advanced</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Advanced AI Camera System</h1>
            <div id="system-status">
                <span class="status-indicator"></span>
                <span id="status-text">SYSTEM LIVE</span>
            </div>
        </header>

        <main>
            <div class="video-container">
                <img src="/video_feed" alt="Video Stream" id="video-feed">
                <div id="overlay-ui">
                    <!-- Dynamic overlays can be added here if needed via JS -->
                </div>
            </div>

            <aside id="control-panel">
                <div class="panel-section">
                    <h3>Active Modules</h3>
                    <ul id="module-list">
                        <li class="module-item active">Face Detection</li>
                        <!-- More modules will appear here -->
                    </ul>
                </div>

                <div class="panel-section">
                    <h3>System Info</h3>
                    <div class="info-grid">
                        <span>Status:</span> <span id="info-status">Processing</span>
                        <span>Backend:</span> <span id="info-backend">FastAPI / Python</span>
                        <span>Architecture:</span> <span id="info-arch">Modular OOP</span>
                    </div>
                </div>
            </aside>
        </main>

        <footer>
            <p>&copy; 2024 AI Vision Pro - Production Grade</p>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
